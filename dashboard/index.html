<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluefolio Studio OS</title>
<meta name="description" content="Local command center for Cluefolio Studio: posts, covers, captions, calendar, pipeline, hashtags, keywords, and SEO.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2315130f'/><text x='50' y='68' font-family='Georgia' font-size='58' fill='%23f4efe6' text-anchor='middle'>C</text><circle cx='78' cy='72' r='6' fill='%23c0533a'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="svg-defs" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
  <symbol id="i-pipeline" viewBox="0 0 24 24"><path d="M4 6h6v5H4zM14 6h6v5h-6zM9 17h6v4H9z"/><path d="M7 11v3h10v-3M12 14v3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5.5-5 4 3.5L17 13l3 3"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 7h8M8 11h8M8 15h5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">C<span>.</span></div>
      <div>
        <div class="brand-name">CLUEFOLIO</div>
        <div class="brand-sub">Studio OS</div>
      </div>
    </div>

    <nav class="nav" aria-label="Dashboard sections">
      <a href="#/overview" data-nav="overview"><svg><use href="#i-grid"/></svg><span>Overview</span></a>
      <a href="#/posts" data-nav="posts"><svg><use href="#i-file"/></svg><span>Posts</span><em id="nav-post-count">11</em></a>
      <a href="#/calendar" data-nav="calendar"><svg><use href="#i-calendar"/></svg><span>Calendar</span></a>
      <a href="#/pipeline" data-nav="pipeline"><svg><use href="#i-pipeline"/></svg><span>Pipeline</span></a>
      <a href="#/seo" data-nav="seo"><svg><use href="#i-search"/></svg><span>SEO &amp; SMM</span></a>
      <a href="#/assets" data-nav="assets"><svg><use href="#i-image"/></svg><span>Assets</span></a>
      <a href="#/playbook" data-nav="playbook"><svg><use href="#i-book"/></svg><span>Playbook</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="local-pill"><span class="dot"></span> Local build</div>
      <p>Evidence-first history for Instagram and Facebook. Every claim traceable. Nothing published without a human.</p>
      <div class="sidebar-meta">
        <span id="sidebar-posts">11 posts</span>
        <span id="sidebar-images">16 images</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <div class="crumbs"><span id="crumb-root">Studio</span><span>/</span><strong id="crumb-page">Overview</strong></div>
      <div class="top-actions">
        <label class="search">
          <svg><use href="#i-search"/></svg>
          <input id="global-search" type="search" placeholder="Search posts, keywords, hashtags…" autocomplete="off">
        </label>
        <a class="icon-btn" href="/site/index.html" target="_blank" rel="noopener" title="Open the static site">
          <svg><use href="#i-external"/></svg>
        </a>
        <button class="icon-btn" id="refresh-btn" title="Refresh data">
          <svg><use href="#i-clock"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
  <figure>
    <img id="lightbox-img" alt="">
    <figcaption id="lightbox-cap"></figcaption>
  </figure>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
